services:
  zalo-web:
    build: .
    container_name: zalo-web-chat
    restart: unless-stopped
    depends_on:
      - opencode
    environment:
      # Mui gio. Container Linux mac dinh chay UTC, lech gio Viet Nam 7 tieng.
      # Khong dat thi bo hen gio se gui sai: chi hen "8h sang" -> may hieu la
      # 8h UTC -> tin bay ra luc 3h chieu.
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      # Bat khi chay sau HTTPS (Caddy). De sai gia tri thi trinh duyet khong gui
      # cookie va khong dang nhap duoc, nen phai dat tuong minh.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Dung de day HTTP sang HTTPS khi ai do vao thang cong 3790 theo thoi quen.
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
      # Khoa ma hoa bi mat trong data/. De trong thi app tu sinh khoa du phong
      # vao data/.secret-key va keu canh bao - chay duoc nhung mat tac dung
      # bao ve ban sao luu, vi khoa nam chung cho voi du lieu.
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      # App KHONG dung TLS_MODE de chay - Caddy moi la ben cap chung chi. Nhung
      # app phai NHIN THAY duoc gia tri nay de kiem cau hinh trien khai luc khoi
      # dong (xem kiemCauHinhTrienKhai trong server.js). Thieu dong nay thi app
      # tuong TLS_MODE chua duoc dat va tu chan minh, du .env da co.
      TLS_MODE: "${TLS_MODE:-internal}"
      # Tai khoan quan tri cho lan chay dau tren CSDL trong. Khong dat thi app
      # tu sinh mat khau ngau nhien va in ra log dung mot lan.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Namespace directory vat ly dung rieng cho moi credential projection.
      # Phai cung absolute path voi OpenCode de session inference realpath duoc.
      OPENCODE_CONTEXT_ROOT: "/opencode-context"
      AI_CAPABILITY_ROUTING_V1_ENABLED: "${AI_CAPABILITY_ROUTING_V1_ENABLED:-false}"
    ports:
      # Chi mo tren may noi bo. Tren VPS thi bo han dong nay: chi Caddy duoc
      # tiep xuc voi internet.
      - "127.0.0.1:3790:3790"
    volumes:
      - ./data:/app/data
      - opencode-context:/opencode-context

  opencode:
    build: ./opencode
    container_name: zalo-web-opencode
    restart: unless-stopped
    # KHONG mo cong ra ngoai. Chi zalo-web goi vao qua mang noi bo Docker
    # bang ten dich vu: http://opencode:4096
    # OpenCode co the chay lenh va dang giu key API, mo cong ra la mo cua cho nguoi la.
    expose:
      - "4096"
    volumes:
      # Key API nam trong config -> bat buoc phai mount, khong thi dung lai
      # container la mat sach key.
      - ./opencode-data/config:/root/.config/opencode
      - ./opencode-data/share:/root/.local/share/opencode
      - opencode-context:/opencode-context

  caddy:
    image: caddy:2-alpine
    container_name: zalo-web-caddy
    restart: unless-stopped
    depends_on:
      - zalo-web
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
      # "internal" = chung chi tu ky, CHI dung khi chay o nha (localhost).
      # Len VPS voi ten mien that thi phai dat TLS_MODE=<email> trong .env, Caddy
      # se tu xin chung chi that. De nguyen "internal" tren mien cong khai thi
      # trinh duyet cua khach bao trang khong an toan - va app se tu chan khong
      # cho chay (xem kiemCauHinhTrienKhai trong server.js).
      TLS_MODE: "${TLS_MODE:-internal}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config

volumes:
  opencode-context:
